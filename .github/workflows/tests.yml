name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install locked dependencies and package
        run: python -m pip install -r requirements-dev.lock .
      - name: Test legislation, jurisprudence, PDF isolation and abuse scenarios
        run: python -m pytest -q --cov=leis_brasileiras --cov-report=term
      - name: Validate all reference laws and prepare local corpus
        run: |
          python -m tools.build_inventory --check --report dist/source-fidelity-report.json
          python -m tools.build_reference --output dist/observed-reference.zip --version ci-reference
      - name: Upload full source fidelity report
        if: ${{ always() && hashFiles('dist/source-fidelity-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: source-fidelity-report
          path: dist/source-fidelity-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel into a clean environment outside source tree
        run: |
          python -m venv /tmp/leis-wheel
          /tmp/leis-wheel/bin/pip install -r requirements.lock dist/*.whl
          cd /tmp
          /tmp/leis-wheel/bin/python -m leis_brasileiras catalog
          /tmp/leis-wheel/bin/python -m leis_brasileiras jurisprudence catalog
          /tmp/leis-wheel/bin/python -c "from importlib.resources import files; assert files('leis_brasileiras').joinpath('schemas/canonical.schema.json').is_file()"
          /tmp/leis-wheel/bin/python -c "from importlib.resources import files; from leis_brasileiras.jurisprudence.catalog import SOURCE_IDS; assert len(SOURCE_IDS) == 6; assert files('leis_brasileiras').joinpath('schemas/jurisprudence.schema.json').is_file()"
